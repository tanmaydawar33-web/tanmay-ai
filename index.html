<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<meta name="description" content="Tanmay AI - Professional AI assistant">
<title>Tanmay AI</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --text: #111827;
    --muted: #667085;
    --border: #e4e7ec;
    --sidebar: #101828;
    --sidebar-text: #d0d5dd;
    --sidebar-muted: #98a2b3;
    --accent: #6366f1;
    --accent2: #06b6d4;
    --success: #22c55e;
    --user: #111827;
    --assistant: #f2f4f7;
}

body.dark {
    --bg: #080b12;
    --surface: #0f172a;
    --surface2: #151e2f;
    --text: #f8fafc;
    --muted: #98a2b3;
    --border: #263247;
    --assistant: #182235;
    --user: #e5e7eb;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

body {
    overflow: hidden;
}

/* APP */

.app {
    width: 100%;
    height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 260px;
    flex: 0 0 260px;
    height: 100vh;
    background:
        linear-gradient(180deg, #101828 0%, #111827 100%);
    color: white;
    padding: 18px;
    display: flex;
    flex-direction: column;
    z-index: 30;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 20px;
}

.logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    box-shadow: 0 8px 25px rgba(99,102,241,0.25);
}

.brand strong {
    font-size: 17px;
    display: block;
}

.brand small {
    color: var(--sidebar-muted);
    font-size: 10px;
}

.new-chat {
    height: 45px;
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 12px;
    background: rgba(255,255,255,0.07);
    color: white;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    transition: 0.18s;
}

.new-chat:hover {
    background: rgba(255,255,255,0.13);
}

.nav-label {
    color: var(--sidebar-muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 27px 8px 9px;
}

.nav-item {
    width: 100%;
    height: 43px;
    border: none;
    border-radius: 11px;
    background: transparent;
    color: var(--sidebar-text);
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 11px;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
    margin-bottom: 4px;
    transition: 0.18s;
}

.nav-item:hover {
    background: rgba(255,255,255,0.07);
    color: white;
}

.nav-item.active {
    background: rgba(99,102,241,0.20);
    color: white;
}

.nav-icon {
    width: 24px;
    text-align: center;
    font-size: 15px;
}

.sidebar-bottom {
    margin-top: auto;
}

.creator {
    padding: 13px;
    border-radius: 13px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
}

.creator span {
    display: block;
    color: var(--sidebar-muted);
    font-size: 10px;
    margin-bottom: 4px;
}

.creator strong {
    font-size: 12px;
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
}

/* TOPBAR */

.topbar {
    height: 68px;
    flex: 0 0 68px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: var(--surface);
}

.mobile-menu {
    display: none;
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
}

.page-title {
    display: flex;
    align-items: center;
    gap: 10px;
}

.page-title-logo {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 900;
}

.page-title strong {
    display: block;
    font-size: 14px;
}

.page-title small {
    color: var(--muted);
    font-size: 10px;
}

.actions {
    display: flex;
    gap: 8px;
}

.action-btn {
    height: 38px;
    min-width: 38px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
}

/* CONTENT */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 30px 7%;
}

#messages::-webkit-scrollbar {
    width: 7px;
}

#messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 20px;
}

/* HOME */

.home {
    max-width: 900px;
    margin: 35px auto;
}

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.hero-logo {
    width: 78px;
    height: 78px;
    margin: 0 auto 18px;
    border-radius: 23px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 900;
    box-shadow: 0 15px 40px rgba(99,102,241,0.22);
}

.hero h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: -1.5px;
}

.hero h1 span {
    background: linear-gradient(90deg, #6366f1, #06b6d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.hero p {
    max-width: 620px;
    margin: 13px auto;
    color: var(--muted);
    line-height: 1.7;
    font-size: 14px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.card {
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    color: var(--text);
    text-align: left;
    transition: 0.18s;
}

.card:hover {
    transform: translateY(-2px);
    border-color: #818cf8;
    box-shadow: 0 10px 25px rgba(15,23,42,0.07);
}

.card-icon {
    font-size: 20px;
    margin-bottom: 10px;
}

.card strong {
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
}

.card span {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
}

/* SECTION PAGE */

.section-page {
    max-width: 900px;
    margin: 25px auto;
}

.section-header {
    margin-bottom: 25px;
}

.section-header .section-icon {
    width: 55px;
    height: 55px;
    border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    margin-bottom: 15px;
}

.section-header h2 {
    margin: 0;
    font-size: 28px;
}

.section-header p {
    color: var(--muted);
    line-height: 1.6;
    font-size: 14px;
}

.tool-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.tool {
    padding: 17px;
    border: 1px solid var(--border);
    border-radius: 15px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: 0.18s;
}

.tool:hover {
    border-color: #818cf8;
    transform: translateY(-2px);
}

.tool strong {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
}

.tool span {
    color: var(--muted);
    font-size: 12px;
}

/* CHAT MESSAGES */

.message {
    display: flex;
    margin-bottom: 24px;
    animation: appear 0.2s ease;
}

.message.user {
    justify-content: flex-end;
}

.message-content {
    display: flex;
    gap: 10px;
    max-width: 850px;
}

.message.user .message-content {
    max-width: 75%;
}

.avatar {
    width: 35px;
    height: 35px;
    flex: 0 0 35px;
    border-radius: 11px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
}

.bubble {
    padding: 13px 16px;
    border-radius: 16px;
    line-height: 1.7;
    font-size: 15px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.assistant .bubble {
    background: var(--assistant);
    color: var(--text);
    border-bottom-left-radius: 5px;
}

.user .bubble {
    background: var(--user);
    color: white;
    border-bottom-right-radius: 5px;
}

/* THINKING */

.thinking {
    display: flex;
    gap: 5px;
    align-items: center;
    min-height: 25px;
}

.dot {
    width: 6px;
    height: 6px;
    background: #6366f1;
    border-radius: 50%;
    animation: pulse 1.1s infinite;
}

.dot:nth-child(2) {
    animation-delay: 0.15s;
}

.dot:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes pulse {
    0%, 80%, 100% {
        opacity: 0.3;
        transform: translateY(0);
    }
    40% {
        opacity: 1;
        transform: translateY(-4px);
    }
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* INPUT */

.input-area {
    border-top: 1px solid var(--border);
    padding: 12px 7% 16px;
    background: var(--surface);
}

.input-box {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 5px 5px 5px 14px;
    border: 1px solid var(--border);
    background: var(--surface2);
    border-radius: 17px;
}

.input-box:focus-within {
    border-color: #818cf8;
    box-shadow: 0 0 0 3px rgba(99,102,241,0.08);
}

input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    padding: 12px 4px;
}

#sendButton {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg, #6366f1, #06b6d4);
    color: white;
    cursor: pointer;
    font-size: 17px;
}

#sendButton:disabled {
    opacity: 0.5;
}

.note {
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    margin-top: 7px;
}

/* MOBILE */

.overlay {
    display: none;
}

@media (max-width: 800px) {

    .sidebar {
        position: fixed;
        left: -270px;
        top: 0;
        bottom: 0;
        transition: left 0.25s ease;
        box-shadow: 15px 0 40px rgba(0,0,0,0.25);
    }

    body.sidebar-open .sidebar {
        left: 0;
    }

    body.sidebar-open .overlay {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 20;
    }

    .mobile-menu {
        display: block;
    }

    .topbar {
        padding: 0 12px;
    }

    #messages {
        padding: 20px 12px;
    }

    .input-area {
        padding: 9px;
    }

    .cards,
    .tool-grid {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 31px;
    }

    .hero-logo {
        width: 65px;
        height: 65px;
    }

    .message-content,
    .message.user .message-content {
        max-width: 96%;
    }

    .page-title-logo {
        display: none;
    }
}
</style>

</head>

<script>

const BACKEND_URL =
    "https://tanmay-ai-0jke.onrender.com";

const pageInfo = {

    chat: {
        title: "Tanmay AI",
        subtitle: "AI assistant online"
    },

    explore: {
        title: "Explore",
        subtitle: "Discover what Tanmay AI can do"
    },

    learning: {
        title: "Learning",
        subtitle: "Learn difficult topics more easily"
    },

    coding: {
        title: "Coding",
        subtitle: "Build, debug and understand code"
    },

    writing: {
        title: "Writing",
        subtitle: "Create clear and professional writing"
    },

    ideas: {
        title: "Ideas",
        subtitle: "Brainstorm and create"
    }
};


/* PAGE SYSTEM */

function showPage(page) {

    closeSidebar();

    document
        .querySelectorAll(".nav-item")
        .forEach(function(item) {
            item.classList.remove("active");
        });

    const nav =
        document.getElementById("nav-" + page);

    if (nav) {
        nav.classList.add("active");
    }

    document.getElementById("pageTitle").textContent =
        pageInfo[page].title;

    document.getElementById("pageSubtitle").textContent =
        pageInfo[page].subtitle;

    if (page === "chat") {
        showHome();
    }

    if (page === "explore") {
        showExplore();
    }

    if (page === "learning") {
        showLearning();
    }

    if (page === "coding") {
        showCoding();
    }

    if (page === "writing") {
        showWriting();
    }

    if (page === "ideas") {
        showIdeas();
    }
}


/* HOME */

function showHome() {

    const messages =
        document.getElementById("messages");

    messages.innerHTML = `
        <div class="home">

            <div class="hero">

                <div class="hero-logo">T</div>

                <h1>
                    Welcome to <span>Tanmay AI</span>
                </h1>

                <p>
                    Your intelligent assistant for learning,
                    coding, writing, ideas and everyday questions.
                </p>

            </div>

            <div class="cards">

                <button class="card"
                    onclick="promptAI('Explain a difficult topic to me step by step.')">
                    <div class="card-icon">📚</div>
                    <strong>Explain a topic</strong>
                    <span>Make difficult concepts easier to understand.</span>
                </button>

                <button class="card"
                    onclick="promptAI('Help me write something professionally.')">
                    <div class="card-icon">✍️</div>
                    <strong>Help me write</strong>
                    <span>Create clear and professional writing.</span>
                </button>

                <button class="card"
                    onclick="promptAI('Help me understand this programming problem.')">
                    <div class="card-icon">💻</div>
                    <strong>Help with coding</strong>
                    <span>Understand programming and solve problems.</span>
                </button>

                <button class="card"
                    onclick="promptAI('Give me some useful ideas for a project.')">
                    <div class="card-icon">💡</div>
                    <strong>Get ideas</strong>
                    <span>Brainstorm creative ideas for your next project.</span>
                </button>

            </div>
        </div>
    `;
}


/* EXPLORE */

function showExplore() {

    renderSection(
        "✨",
        "Explore Tanmay AI",
        "Choose something you would like Tanmay AI to help you with.",
        [
            ["📚", "Learn something", "Explain any topic clearly.", "Explain a difficult topic to me step by step."],
            ["💻", "Solve a coding problem", "Understand code and programming concepts.", "Help me understand a programming problem."],
            ["✍️", "Improve my writing", "Make your writing clearer and better.", "Help me improve my writing."],
            ["💡", "Brainstorm ideas", "Generate useful project and creative ideas.", "Give me 10 useful project ideas."],
            ["🧠", "Study with me", "Create a study explanation or quiz.", "Teach me a topic like a patient tutor."],
            ["🔎", "Ask a question", "Ask Tanmay AI anything.", "I have a question for you."]
        ]
    );
}


/* LEARNING */

function showLearning() {

    renderSection(
        "📚",
        "Learning",
        "Use Tanmay AI as your personal study assistant.",
        [
            ["🧠", "Teach me a topic", "Learn a concept step by step.", "Teach me a difficult topic step by step."],
            ["📝", "Make revision notes", "Turn a topic into quick revision notes.", "Make concise revision notes for a topic."],
            ["❓", "Create questions", "Practice with questions.", "Create 10 practice questions for a topic."],
            ["🎯", "Test me", "Take a short quiz.", "Quiz me on a topic."],
            ["🔬", "Explain science", "Understand science concepts.", "Explain a science concept simply."],
            ["➗", "Solve maths", "Work through a maths problem.", "Help me solve a maths problem step by step."]
        ]
    );
}


/* CODING */

function showCoding() {

    renderSection(
        "💻",
        "Coding",
        "Get help understanding programming and building projects.",
        [
            ["🐞", "Debug code", "Find and explain coding errors.", "Help me debug my code."],
            ["📖", "Explain code", "Understand what code does.", "Explain this code to me simply."],
            ["🏗️", "Build a project", "Plan a programming project.", "Help me plan a programming project."],
            ["⚡", "Improve code", "Make code cleaner and easier to understand.", "How can I improve my code?"],
            ["🧩", "Solve a problem", "Work through a programming problem.", "Help me solve a programming problem."],
            ["🚀", "Learn programming", "Start learning programming concepts.", "Teach me programming from the basics."]
        ]
    );
}


/* WRITING */

function showWriting() {

    renderSection(
        "✍️",
        "Writing",
        "Create, improve and organize your writing.",
        [
            ["📧", "Write an email", "Create a professional email.", "Help me write a professional email."],
            ["📝", "Improve text", "Make writing clearer and better.", "Improve this piece of writing."],
            ["📄", "Write an essay", "Plan and draft an essay.", "Help me write an essay."],
            ["🎤", "Write a speech", "Create a clear speech.", "Help me write a speech."],
            ["📱", "Social post", "Create a social media post.", "Help me write a social media post."],
            ["💼", "Professional writing", "Make your writing sound professional.", "Make this writing sound professional."]
        ]
    );
}


/* IDEAS */

function showIdeas() {

    renderSection(
        "💡",
        "Ideas",
        "Brainstorm useful and creative ideas with Tanmay AI.",
        [
            ["🚀", "Project ideas", "Find ideas for your next project.", "Give me 10 project ideas."],
            ["💻", "AI ideas", "Brainstorm AI project concepts.", "Give me some AI project ideas."],
            ["🎮", "Game ideas", "Create game concepts.", "Give me some original game ideas."],
            ["📱", "App ideas", "Brainstorm useful app ideas.", "Give me useful app ideas."],
            ["🎨", "Creative ideas", "Generate creative concepts.", "Give me some creative ideas."],
            ["🧠", "Solve a problem", "Brainstorm ways to solve a problem.", "Help me brainstorm solutions to a problem."]
        ]
    );
}


/* SECTION RENDERER */

function renderSection(icon, title, description, tools) {

    const messages =
        document.getElementById("messages");

    messages.innerHTML = "";

    const page =
        document.createElement("div");

    page.className = "section-page";

    const header =
        document.createElement("div");

    header.className = "section-header";

    header.innerHTML =
        "<div class='section-icon'>" +
        icon +
        "</div>" +
        "<h2>" +
        title +
        "</h2>" +
        "<p>" +
        description +
        "</p>";

    const grid =
        document.createElement("div");

    grid.className = "tool-grid";

    tools.forEach(function(tool) {

        const button =
            document.createElement("button");

        button.className = "tool";

        button.innerHTML =
            "<strong>" +
            tool[0] +
            " " +
            tool[1] +
            "</strong>" +
            "<span>" +
            tool[2] +
            "</span>";

        button.onclick =
            function() {
                promptAI(tool[3]);
            };

        grid.appendChild(button);
    });

    page.appendChild(header);
    page.appendChild(grid);

    messages.appendChild(page);
}


/* SEND PROMPT */

function promptAI(text) {

    showPage("chat");

    const input =
        document.getElementById("userInput");

    input.value = text;

    input.focus();
}


/* CHAT */

async function sendMessage() {

    const input =
        document.getElementById("userInput");

    const button =
        document.getElementById("sendButton");

    const text =
        input.value.trim();

    if (!text || button.disabled) {
        return;
    }

    showPage("chat");

    document
        .getElementById("messages")
        .innerHTML = "";

    addMessage(text, "user");

    input.value = "";

    button.disabled = true;

    const thinking =
        addThinking();

    try {

        const response =
            await fetch(
                BACKEND_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Request failed"
            );
        }

        thinking.remove();

        addMessage(
            cleanResponse(
                data.reply ||
                "I couldn't generate a response."
            ),
            "assistant"
        );

    } catch (error) {

        thinking.remove();

        addMessage(
            "Sorry, Tanmay AI could not connect to the AI service. Please try again.",
            "assistant"
        );

        console.error(error);

    } finally {

        button.disabled = false;

        input.focus();
    }
}


/* CLEAN RESPONSE */

function cleanResponse(text) {

    if (!text) {
        return "";
    }

    return text
        .replace(/^#{1,6}\s*/gm, "")
        .replace(/\*\*(.*?)\*\*/g, "$1")
        .replace(/\*(.*?)\*/g, "$1")
        .replace(/`{1,3}/g, "")
        .replace(/^\s*[-|]\s*/gm, "")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
}


/* MESSAGE */

function addMessage(text, type) {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    if (type === "assistant") {

        const avatar =
            document.createElement("div");

        avatar.className =
            "avatar";

        avatar.textContent = "T";

        content.appendChild(avatar);
    }

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    content.appendChild(bubble);

    message.appendChild(content);

    messages.appendChild(message);

    scrollBottom();

    return message;
}


/* THINKING */

function addThinking() {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message assistant";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent = "T";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble thinking";

    for (let i = 0; i < 3; i++) {

        const dot =
            document.createElement("span");

        dot.className =
            "dot";

        bubble.appendChild(dot);
    }

    content.appendChild(avatar);
    content.appendChild(bubble);

    message.appendChild(content);

    messages.appendChild(message);

    scrollBottom();

    return message;
}


/* NEW CHAT */

function newChat() {

    showPage("chat");

    document
        .getElementById("userInput")
        .focus();
}


/* THEME */

function toggleTheme() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "tanmay-theme",
        document.body.classList.contains("dark")
            ? "dark"
            : "light"
    );
}


/* MOBILE SIDEBAR */

function toggleSidebar() {

    document.body.classList.toggle(
        "sidebar-open"
    );
}


function closeSidebar() {

    document.body.classList.remove(
        "sidebar-open"
    );
}


/* SCROLL */

function scrollBottom() {

    const messages =
        document.getElementById("messages");

    messages.scrollTop =
        messages.scrollHeight;
}


/* ENTER */

document
    .getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }
    );


/* LOAD THEME */

if (
    localStorage.getItem("tanmay-theme")
    === "dark"
) {
    document.body.classList.add("dark");
}


/* START */

showHome();

</script>
