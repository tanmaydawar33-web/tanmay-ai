<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;

        color: #111827;
    }

    body {

        justify-content: center;
        align-items: center;
    }

    .app {

        overflow: hidden;
    }

    /* HEADER */

    header {

        display: flex;

    }

    .brand {
        display: flex;

    }

    .logo {

        display: flex;

        justify-content: center;

        font-weight: 700;
    }

    .brand-name {
        margin: 0;

        font-weight: 750;
    }

    .status {
        display: flex;
        align-items: center;

        margin-top: 3px;

        border-radius: 50%;

    }

    .new-chat {

        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
    }

    .new-chat:hover {
        background: #f3f4f6;
    }

    /* CHAT */

    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 30px 24px;
        scroll-behavior: smooth;
    }

    /* WELCOME */

    .welcome {
        max-width: 700px;
        margin: 55px auto 35px;
        text-align: center;
    }

    .welcome-logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 22px;
        background: #111827;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        box-shadow: 0 12px 30px rgba(17, 24, 39, 0.18);
    }

    .welcome h2 {
        margin: 0;
        font-size: 32px;
        letter-spacing: -0.7px;
    }

    .welcome p {
        max-width: 560px;
        margin: 12px auto 0;
        color: #64748b;
        line-height: 1.65;
        font-size: 15px;
    }

    .suggestions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 28px;
    }

    .suggestion {
        padding: 16px;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        background: #ffffff;
        color: #334155;
        cursor: pointer;
        text-align: left;
        font-size: 14px;
        transition: 0.15s;
    }

    .suggestion:hover {
        background: #f8fafc;
        border-color: #cbd5e1;
        transform: translateY(-1px);
    }

    .suggestion-title {
        display: block;
        font-weight: 650;
        margin-bottom: 4px;
    }

    .suggestion-text {
        color: #64748b;
        font-size: 12px;
    }

    /* MESSAGE */

    .message {
        display: flex;
        margin-bottom: 24px;
        animation: messageIn 0.2s ease;
    }

    .message.user {
        justify-content: flex-end;
    }

    @keyframes messageIn {
        from {
            opacity: 0;
            transform: translateY(6px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .message-content {
        display: flex;
        gap: 10px;
        max-width: 82%;
        align-items: flex-start;
    }

    .assistant-avatar {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 10px;
        background: #111827;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
    }

    .bubble {
        padding: 13px 16px;
        border-radius: 16px;
        line-height: 1.65;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 15px;
    }

    .assistant .bubble {
        background: #f1f5f9;
        color: #1e293b;
        border-bottom-left-radius: 5px;
    }

    .user .bubble {
        background: #111827;
        color: white;
        border-bottom-right-radius: 5px;
    }

    /* THINKING */

    .thinking {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 58px;
    }

    .thinking-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #64748b;
        animation: thinking 1.2s infinite ease-in-out;
    }

    .thinking-dot:nth-child(2) {
        animation-delay: 0.15s;
    }

    .thinking-dot:nth-child(3) {
        animation-delay: 0.3s;
    }

    @keyframes thinking {
        0%, 80%, 100% {
            transform: translateY(0);
            opacity: 0.4;
        }

        40% {
            transform: translateY(-4px);
            opacity: 1;
        }
    }

    /* INPUT */

    .input-area {
        padding: 14px 18px 17px;
        border-top: 1px solid #e5e7eb;
        background: white;
    }

    .input-box {
        max-width: 900px;
        margin: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px;
        border: 1px solid #cbd5e1;
        border-radius: 16px;
        background: white;
    }

    .input-box:focus-within {
        border-color: #64748b;
        box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.10);
    }

    input {
        flex: 1;
        min-width: 0;
        padding: 12px;
        border: none;
        outline: none;
        background: transparent;
        color: #111827;
        font-size: 15px;
    }

    input::placeholder {
        color: #94a3b8;
    }

    #sendButton {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 12px;
        background: #111827;
        color: white;
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #sendButton:hover {
        opacity: 0.9;
    }

    #sendButton:disabled {
        opacity: 0.55;
        cursor: wait;
    }

    .footer-note {
        margin-top: 7px;
        text-align: center;
        color: #94a3b8;
        font-size: 10px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

        body {
            align-items: stretch;
            background: white;
        }

        .app {
            width: 100%;
            height: 100dvh;
            min-height: 100dvh;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        header {
            height: 64px;
            padding: 0 12px;
        }

        .logo {
            width: 38px;
            height: 38px;
            border-radius: 11px;

        }

            gap: 9px;

            font-size: 17px;
        }

        .status {

        .new-chat {

            font-size: 12px;

        }

            margin: 42px auto 25px;
            padding: 0 5px;
        }

            padding: 11px 9px;
        }

        #sendButton {
            width: 42px;
            height: 42px;
        }
    }
</style>

</div>

<script>

const BACKEND_URL =
    "https://tanmay-ai-0jke.onrender.com";


async function sendMessage() {

    const input =
        document.getElementById("userInput");

    const button =
        document.getElementById("sendButton");

    const text =
        input.value.trim();

    if (!text || button.disabled) {
        return;
    }

    removeWelcome();

    addMessage(text, "user");

    input.value = "";

    button.disabled = true;

    const thinking =
        addThinkingMessage();

    try {

        const response =
            await fetch(
                BACKEND_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Request failed."
            );
        }

        thinking.remove();

        addMessage(
            data.reply ||
            "I couldn't generate a response.",
            "assistant"
        );

    } catch (error) {

        thinking.remove();

        addMessage(
            "Sorry, Tanmay AI could not connect to the AI service. Please try again.",
            "assistant"
        );

        console.error(
            "Tanmay AI error:",
            error
        );

    } finally {

        button.disabled = false;

        input.focus();
    }
}


function addMessage(text, type) {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    if (type === "assistant") {

        const avatar =
            document.createElement("div");

        avatar.className =
            "assistant-avatar";

        avatar.textContent = "T";

        content.appendChild(avatar);
    }


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;


    content.appendChild(bubble);

    message.appendChild(content);

    messages.appendChild(message);

    scrollToBottom();

    return message;
}


function addThinkingMessage() {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message assistant";


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const avatar =
        document.createElement("div");

    avatar.className =
        "assistant-avatar";

    avatar.textContent = "T";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble thinking";


    bubble.innerHTML =
        '<span class="thinking-dot"></span>' +
        '<span class="thinking-dot"></span>' +
        '<span class="thinking-dot"></span>';


    content.appendChild(avatar);

    content.appendChild(bubble);

    message.appendChild(content);

    messages.appendChild(message);

    scrollToBottom();

    return message;
}


function removeWelcome() {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }
}


function useSuggestion(text) {

    const input =
        document.getElementById("userInput");

    input.value = text;

    input.focus();
}


function newChat() {

    const messages =
        document.getElementById("messages");

    messages.innerHTML = `
        <div class="welcome" id="welcome">

            <div class="welcome-logo">T</div>

            <h2>Welcome to Tanmay AI</h2>

            <p>
                Your professional AI assistant for learning,
                coding, writing, ideas, and everyday questions.
            </p>

            <div class="suggestions">

                <button
                    class="suggestion"
                    onclick="useSuggestion('Explain a difficult topic to me step by step.')">

                    <span class="suggestion-title">
                        📚 Explain a topic
                    </span>

                    <span class="suggestion-text">
                        Learn something clearly
                    </span>

                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('Help me write something professionally.')">

                    <span class="suggestion-title">
                        ✍️ Help me write
                    </span>

                    <span class="suggestion-text">
                        Improve or create text
                    </span>

                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('Help me understand this programming problem.')">

                    <span class="suggestion-title">
                        💻 Help with coding
                    </span>

                    <span class="suggestion-text">
                        Debug and understand code
                    </span>

                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('Give me some useful ideas for a project.')">

                    <span class="suggestion-title">
                        💡 Get ideas
                    </span>

                    <span class="suggestion-text">
                        Brainstorm something new
                    </span>

                </button>

            </div>

        </div>
    `;

    document
        .getElementById("userInput")
        .focus();
}


function scrollToBottom() {

    const messages =
        document.getElementById("messages");

    messages.scrollTop =
        messages.scrollHeight;
}


document
    .getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }
    );

</script>
