<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;

        color: #1f2937;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .app {
        width: min(950px, 96vw);
        height: min(900px, 94vh);
        background: white;
        border-radius: 20px;
        box-shadow: 0 12px 45px rgba(0, 0, 0, 0.10);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    header {
        padding: 20px 24px;
        border-bottom: 1px solid #e5e7eb;
        background: white;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
    }

    header p {
        margin: 6px 0 0;
        color: #6b7280;
        font-size: 14px;
    }

    #messages {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        scroll-behavior: smooth;
    }

    .message {
        margin-bottom: 18px;
        line-height: 1.6;
        animation: appear 0.2s ease;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(5px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .user {
        text-align: right;
    }

    .bubble {
        display: inline-block;
        max-width: 78%;
        padding: 12px 16px;
        border-radius: 16px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .user .bubble {
        background: #111827;
        color: white;
        border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
        background: #f3f4f6;
        color: #1f2937;
        border-bottom-left-radius: 5px;
    }

    .input-area {
        display: flex;
        gap: 10px;
        padding: 16px;
        border-top: 1px solid #e5e7eb;
        background: white;
    }

    input {
        flex: 1;
        min-width: 0;
        padding: 14px 16px;
        border: 1px solid #d1d5db;
        border-radius: 14px;

    button {
        border: none;
        border-radius: 14px;
        padding: 0 22px;

<header>

```

</div>

<script>
const BACKEND_URL = "https://tanmay-ai-0jke.onrender.com";

async function sendMessage() {

    const input = document.getElementById("userInput");
    const button = document.getElementById("sendButton");
    const text = input.value.trim();

    if (!text || button.disabled) return;

    addMessage(text, "user");

    input.value = "";
    button.disabled = true;
    button.textContent = "Thinking...";

    const thinking = addMessage(
        "Tanmay AI is thinking...",
        "assistant"
    );

    try {

        const response = await fetch(
            BACKEND_URL + "/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: text
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Request failed."
            );
        }

        thinking.querySelector(".bubble").textContent =
            data.reply ||
            "I couldn't generate a response.";

    } catch (error) {

        thinking.querySelector(".bubble").textContent =
            "Sorry, Tanmay AI could not connect to the AI service.";

        console.error(error);

    } finally {

        button.disabled = false;
        button.textContent = "Send";
        input.focus();
    }
}

function addMessage(text, type) {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const bubble =
        document.createElement("span");

    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(bubble);
    messages.appendChild(message);

    messages.scrollTop =
        messages.scrollHeight;

    return message;
}

document
    .getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }
    );
</script>
