<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Tanmay AI - Your intelligent AI assistant">
<title>Tanmay AI</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f7fb;
    --panel: rgba(255,255,255,0.82);
    --card: #ffffff;
    --text: #111827;
    --muted: #64748b;
    --border: #e2e8f0;
    --assistant: #f1f5f9;
    --user: #111827;
    --input: #ffffff;
    --shadow: 0 25px 80px rgba(15,23,42,0.12);
}

body.dark {
    --bg: #070b14;
    --panel: rgba(15,23,42,0.88);
    --card: #111827;
    --text: #f8fafc;
    --muted: #94a3b8;
    --border: #243044;
    --assistant: #172033;
    --user: #f8fafc;
    --input: #0f172a;
    --shadow: 0 25px 80px rgba(0,0,0,0.35);
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.25s, color 0.25s;
}

body::before,
body::after {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.12;
    pointer-events: none;
}

body::before {
    top: -100px;
    left: -100px;
    background: #6366f1;
}

body::after {
    right: -100px;
    bottom: -100px;
    background: #06b6d4;
}

.app {
    position: relative;
    width: min(1180px, 96vw);
    height: min(900px, 94vh);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 28px;
    background: var(--panel);
    backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
}

/* HEADER */

header {
    height: 76px;
    padding: 0 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: var(--user);
    color: var(--bg);
    font-size: 21px;
    font-weight: 800;
    box-shadow: 0 8px 20px rgba(15,23,42,0.18);
}

.brand-name {
    margin: 0;
    font-size: 19px;
    font-weight: 750;
    letter-spacing: -0.3px;
}

.status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    color: var(--muted);
    font-size: 11px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 4px rgba(34,197,94,0.10);
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-button,
.new-chat {
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    transition: 0.18s;
}

.icon-button {
    width: 40px;
    font-size: 16px;
}

.new-chat {
    padding: 0 14px;
    font-size: 13px;
    font-weight: 650;
}

.icon-button:hover,
.new-chat:hover {
    transform: translateY(-1px);
    border-color: var(--muted);
}

/* CHAT */

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 24px;
    scroll-behavior: smooth;
}

#messages::-webkit-scrollbar {
    width: 7px;
}

#messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 20px;
}

/* WELCOME */

.welcome {
    max-width: 760px;
    margin: 55px auto 30px;
    text-align: center;
}

.welcome-logo {
    width: 76px;
    height: 76px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    background: var(--user);
    color: var(--bg);
    font-size: 34px;
    font-weight: 800;
    box-shadow: 0 15px 35px rgba(15,23,42,0.18);
}

.welcome h2 {
    margin: 0;
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: -1.2px;
}

.welcome p {
    max-width: 590px;
    margin: 13px auto 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 30px;
}

.suggestion {
    min-height: 94px;
    padding: 17px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    transition: 0.18s;
}

.suggestion:hover {
    transform: translateY(-3px);
    border-color: var(--muted);
    box-shadow: 0 10px 25px rgba(15,23,42,0.07);
}

.suggestion-title {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: 700;
}

.suggestion-text {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
}

/* MESSAGES */

.message {
    display: flex;
    margin-bottom: 22px;
    animation: messageIn 0.2s ease;
}

.message.user {
    justify-content: flex-end;
}

.message-content {
    display: flex;
    gap: 10px;
    max-width: min(850px, 88%);
    align-items: flex-start;
}

.assistant-avatar {
    width: 35px;
    height: 35px;
    flex: 0 0 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 11px;
    background: var(--user);
    color: var(--bg);
    font-size: 15px;
    font-weight: 800;
}

.bubble {
    padding: 13px 16px;
    border-radius: 17px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    font-size: 15px;
    white-space: pre-wrap;
}

.assistant .bubble {
    background: var(--assistant);
    color: var(--text);
    border-bottom-left-radius: 5px;
}

.user .bubble {
    background: var(--user);
    color: var(--bg);
    border-bottom-right-radius: 5px;
}

/* THINKING */

.thinking {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 58px;
}

.thinking-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: thinking 1.2s infinite ease-in-out;
}

.thinking-dot:nth-child(2) {
    animation-delay: 0.15s;
}

.thinking-dot:nth-child(3) {
    animation-delay: 0.3s;
}

@keyframes thinking {
    0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.35;
    }

    40% {
        transform: translateY(-4px);
        opacity: 1;
    }
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* INPUT */

.input-area {
    padding: 14px 18px 17px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
}

.input-box {
    max-width: 900px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 5px 5px 14px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: var(--input);
    transition: 0.18s;
}

.input-box:focus-within {
    border-color: var(--muted);
    box-shadow: 0 0 0 4px rgba(100,116,139,0.08);
}

input {
    flex: 1;
    min-width: 0;
    padding: 12px 4px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
}

input::placeholder {
    color: var(--muted);
}

#sendButton {
    width: 44px;
    height: 44px;
    flex: 0 0 44px;
    border: none;
    border-radius: 13px;
    background: var(--user);
    color: var(--bg);
    cursor: pointer;
    font-size: 18px;
    transition: 0.18s;
}

#sendButton:hover {
    transform: scale(1.04);
}

#sendButton:disabled {
    opacity: 0.5;
    cursor: wait;
    transform: none;
}

.footer-note {
    margin-top: 7px;
    text-align: center;
    color: var(--muted);
    font-size: 10px;
}

/* MOBILE */

@media (max-width: 600px) {

    body {
        align-items: stretch;
        background: var(--bg);
    }

    .app {
        width: 100%;
        height: 100dvh;
        min-height: 100dvh;
        border: none;
        border-radius: 0;
        box-shadow: none;
    }

    header {
        height: 64px;
        padding: 0 12px;
    }

    .logo {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        font-size: 18px;
    }

    .brand {
        gap: 9px;
    }

    .brand-name {
        font-size: 17px;
    }

    .status {
        font-size: 10px;
    }

    .new-chat {
        height: 37px;
        padding: 0 10px;
        font-size: 12px;
    }

    .icon-button {
        width: 37px;
        height: 37px;
    }

    #messages {
        padding: 18px 10px;
    }

    .welcome {
        margin: 40px auto 25px;
        padding: 0 6px;
    }

    .welcome-logo {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        font-size: 28px;
    }

    .welcome h2 {
        font-size: 27px;
    }

    .welcome p {
        font-size: 13px;
    }

    .suggestions {
        grid-template-columns: 1fr;
        gap: 9px;
        margin-top: 22px;
    }

    .suggestion {
        min-height: auto;
        padding: 14px;
    }

    .message-content {
        max-width: 94%;
    }

    .bubble {
        font-size: 14px;
        padding: 11px 13px;
    }

    .assistant-avatar {
        width: 30px;
        height: 30px;
        flex-basis: 30px;
        font-size: 14px;
    }

    .input-area {
        padding: 8px 8px 10px;
    }

    .input-box {
        border-radius: 14px;
        padding-left: 11px;
    }

    input {
        font-size: 16px;
        padding: 11px 4px;
    }

    #sendButton {
        width: 42px;
        height: 42px;
        flex-basis: 42px;
    }
}
</style>

</head>

<body>

<div class="app">

<header>

```
<div class="brand">

    <div class="logo">T</div>

    <div>
        <h1 class="brand-name">Tanmay AI</h1>

        <div class="status">
            <span class="status-dot"></span>
            AI assistant online
        </div>
    </div>

</div>

<div class="header-actions">

    <button
        class="icon-button"
        id="themeButton"
        onclick="toggleTheme()"
        aria-label="Toggle theme">
        ◐
    </button>

    <button
        class="new-chat"
        onclick="newChat()">
        + New Chat
    </button>

</div>
```

</header>

<div id="messages">

```
<div class="welcome" id="welcome">

    <div class="welcome-logo">T</div>

    <h2>What can I help you with?</h2>

    <p>
        Meet Tanmay AI — your intelligent assistant for
        learning, coding, writing, ideas, and everyday questions.
    </p>

    <div class="suggestions">

        <button
            class="suggestion"
            onclick="useSuggestion('Explain a difficult topic to me step by step.')">

            <span class="suggestion-title">
                📚 Explain a topic
            </span>

            <span class="suggestion-text">
                Learn something clearly and easily
            </span>

        </button>

        <button
            class="suggestion"
            onclick="useSuggestion('Help me write something professionally.')">

            <span class="suggestion-title">
                ✍️ Help me write
            </span>

            <span class="suggestion-text">
                Create or improve your writing
            </span>

        </button>

        <button
            class="suggestion"
            onclick="useSuggestion('Help me understand this programming problem.')">

            <span class="suggestion-title">
                💻 Help with coding
            </span>

            <span class="suggestion-text">
                Understand code and solve problems
            </span>

        </button>

        <button
            class="suggestion"
            onclick="useSuggestion('Give me some useful ideas for a project.')">

            <span class="suggestion-title">

            </span>

</div>

</div>

<div class="input-area">

```
<div class="input-box">

    <input
        id="userInput"
        type="text"
        placeholder="Message Tanmay AI..."
        autocomplete="off"
        maxlength="4000">

    <button
        id="sendButton"
        onclick="sendMessage()"
        aria-label="Send">
        ➤
    </button>

</div>

<div class="footer-note">
    Tanmay AI can make mistakes. Check important information.
</div>
```

</div>

</div>

<script>

const BACKEND_URL =
    "https://tanmay-ai-0jke.onrender.com";


async function sendMessage() {

    const input =
        document.getElementById("userInput");

    const button =
        document.getElementById("sendButton");

    const text =
        input.value.trim();

    if (!text || button.disabled) {
        return;
    }

    removeWelcome();

    addMessage(text, "user");

    input.value = "";

    button.disabled = true;

    const thinking =
        addThinkingMessage();

    try {

        const response =
            await fetch(
                BACKEND_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || "Request failed."
            );
        }

        thinking.remove();

        addMessage(
            data.reply ||
            "I couldn't generate a response.",
            "assistant"
        );

    } catch (error) {

        thinking.remove();

        addMessage(
            "Sorry, Tanmay AI could not connect to the AI service. Please try again.",
            "assistant"
        );

        console.error(
            "Tanmay AI error:",
            error
        );

    } finally {

        button.disabled = false;

        input.focus();
    }
}


function addMessage(text, type) {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message " + type;

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    if (type === "assistant") {

        const avatar =
            document.createElement("div");

        avatar.className =
            "assistant-avatar";

        avatar.textContent = "T";

        content.appendChild(avatar);
    }

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    /*
       Use textContent for AI replies.
       This keeps responses safe and prevents
       returned HTML from being executed.
    */

    bubble.textContent =
        text;

    content.appendChild(bubble);

    message.appendChild(content);

    messages.appendChild(message);

    scrollToBottom();

    return message;
}


function addThinkingMessage() {

    const messages =
        document.getElementById("messages");

    const message =
        document.createElement("div");

    message.className =
        "message assistant";

    const content =
        document.createElement("div");

    content.className =
        "message-content";

    const avatar =
        document.createElement("div");

    avatar.className =
        "assistant-avatar";

    avatar.textContent = "T";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble thinking";

    const dot1 =
        document.createElement("span");

    const dot2 =
        document.createElement("span");

    const dot3 =
        document.createElement("span");

    dot1.className = "thinking-dot";
    dot2.className = "thinking-dot";
    dot3.className = "thinking-dot";

    bubble.appendChild(dot1);
    bubble.appendChild(dot2);
    bubble.appendChild(dot3);

    content.appendChild(avatar);
    content.appendChild(bubble);

    message.appendChild(content);
    messages.appendChild(message);

    scrollToBottom();

    return message;
}


function removeWelcome() {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }
}


function useSuggestion(text) {

    const input =
        document.getElementById("userInput");

    input.value =
        text;

    input.focus();
}


function newChat() {

    const messages =
        document.getElementById("messages");

    messages.innerHTML = "";

    const welcome =
        document.createElement("div");

    welcome.className = "welcome";
    welcome.id = "welcome";

    const logo =
        document.createElement("div");

    logo.className = "welcome-logo";
    logo.textContent = "T";

    const heading =
        document.createElement("h2");

    heading.textContent =
        "What can I help you with?";

    const paragraph =
        document.createElement("p");

    paragraph.textContent =
        "Meet Tanmay AI — your intelligent assistant for learning, coding, writing, ideas, and everyday questions.";

    const suggestions =
        document.createElement("div");

    suggestions.className =
        "suggestions";

    const options = [
        ["📚 Explain a topic", "Learn something clearly and easily", "Explain a difficult topic to me step by step."],
        ["✍️ Help me write", "Create or improve your writing", "Help me write something professionally."],
        ["💻 Help with coding", "Understand code and solve problems", "Help me understand this programming problem."],
        ["💡 Get ideas", "Brainstorm and discover possibilities", "Give me some useful ideas for a project."]
    ];

    options.forEach(function(option) {

        const button =
            document.createElement("button");

        button.className =
            "suggestion";

        const title =
            document.createElement("span");

        title.className =
            "suggestion-title";

        title.textContent =
            option[0];

        const description =
            document.createElement("span");

        description.className =
            "suggestion-text";

        description.textContent =
            option[1];

        button.appendChild(title);
        button.appendChild(description);

        button.addEventListener(
            "click",
            function() {
                useSuggestion(option[2]);
            }
        );

        suggestions.appendChild(button);
    });

    welcome.appendChild(logo);
    welcome.appendChild(heading);
    welcome.appendChild(paragraph);
    welcome.appendChild(suggestions);

    messages.appendChild(welcome);

    document
        .getElementById("userInput")
        .focus();
}


function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "tanmay-theme",
        dark ? "dark" : "light"
    );
}


function loadTheme() {

    const saved =
        localStorage.getItem("tanmay-theme");

    if (saved === "dark") {
        document.body.classList.add("dark");
    }
}


function scrollToBottom() {

    const messages =
        document.getElementById("messages");

    messages.scrollTop =
        messages.scrollHeight;
}


document
    .getElementById("userInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }
    );


loadTheme();

</script>

</body>
</html>
